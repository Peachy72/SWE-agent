# Formerly called: anthropic_filemap.yaml
# This template is heavily inspired by anthropic's computer use demo, but you can use
# it with any LM.
agent:
  templates:
    system_template: |-
      You are an expert software engineer with access to a command-line interface, editor, and other tools.
      Your job is to make precise, minimal code edits to fix bugs or implement feature requests based on a problem description.
      Only modify code that is necessary. Do not touch test files. Use tools to search, execute, and verify.
      Always reason step-by-step and verify your fixes before submitting.
    instance_template: |-
      <uploaded_files>
      {{working_dir}}
      </uploaded_files>

      I've uploaded a Python code repository into the directory {{working_dir}}. The following description outlines a bug fix or feature request:

      <pr_description>
      {{problem_statement}}
      </pr_description>

      Your task is to implement only the necessary code changes to satisfy the description above. The tests have already been handled, so do NOT modify any test files.

      Please follow these best practices:
      1. Identify relevant files or functions using grep or manual inspection.
      2. Write a script to reproduce the issue if necessary.
      3. Make minimal code edits. Avoid rewriting or refactoring unrelated code.
      4. Rerun your script to verify the fix works.
      5. Handle possible edge cases. Be thorough but focused.

      Do not return explanations — only perform actions that move the issue toward resolution.
    next_step_template: |-
      OBSERVATION:
      {{observation}}
    next_step_no_output_template: |-
      Your command ran successfully and did not produce any output.
  tools:
    env_variables:
      PAGER: cat
      MANPAGER: cat
      LESS: -R
      PIP_PROGRESS_BAR: 'off'
      TQDM_DISABLE: '1'
      GIT_PAGER: cat
    bundles:
      - path: tools/registry
      - path: tools/edit_anthropic
      - path: tools/review_on_submit_m
      - path: tools/registry/run_tests.py

    registry_variables:
      USE_FILEMAP: 'true'
      SUBMIT_REVIEW_MESSAGES:
        - |
          Thank you for your work on this issue. Please carefully follow the steps below to help review your changes.

          1. If you made any changes to your code after running the reproduction script, please run the reproduction script again.
            If the reproduction script is failing, please revisit your changes and make sure they are correct.
            If you have already removed your reproduction script, please ignore this step.
          2. Remove your reproduction script (if you haven't done so already).
          3. If you have modified any TEST files, please revert them to the state they had before you started fixing the issue.
            You can do this with `git checkout -- /path/to/test/file.py`. Use below <diff> to find the files you need to revert.
          4. Run the submit command again to confirm.

          Here is a list of all of your changes:

          <diff>
          {{diff}}
          </diff>
    enable_bash_tool: true
    parse_function:
      type: function_calling
  history_processors:
    - type: cache_control
      last_n_messages: 2
